name: Keepalive Reminder

# 每天探，距上次提醒 >= 55 天才推 Bark。提醒后用户去手动 Run vix-check.yml
# 即可重置 60 天 cron 禁用计时（scheduled run 本身不算活动）。
on:
  schedule:
    - cron: '7 6 * * *'   # 每天 UTC 06:07 = 北京 14:07（错开整点）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Restore last-reminder timestamp
        uses: actions/cache@v5
        with:
          path: .last_reminder
          key: keepalive-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            keepalive-

      - name: Decide whether to remind
        id: check
        run: |
          NOW=$(date +%s)
          if [ -f .last_reminder ] && [ -s .last_reminder ]; then
            LAST=$(cat .last_reminder)
            ELAPSED=$(( (NOW - LAST) / 86400 ))
            echo "距上次提醒 $ELAPSED 天"
            echo "elapsed_days=$ELAPSED" >> "$GITHUB_OUTPUT"
            if [ "$ELAPSED" -ge 55 ]; then
              echo "should_remind=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "首次运行或无 cache → 发提醒并初始化时间戳"
            echo "elapsed_days=N/A" >> "$GITHUB_OUTPUT"
            echo "should_remind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Bark reminder
        if: steps.check.outputs.should_remind == 'true'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          ELAPSED: ${{ steps.check.outputs.elapsed_days }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          : "${BARK_SERVER:=https://api.day.app}"
          URL="https://github.com/${REPO}/actions/workflows/vix-check.yml"
          curl -sS --fail -X POST "${BARK_SERVER}/${BARK_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"title":"VIX 系统保活提醒","body":"已 %s 天未保活。点开链接进 Actions 手动 Run vix-check.yml 重置 60 天 cron 禁用计时。","group":"VIX预警保活","level":"active","url":"%s"}' "$ELAPSED" "$URL")"
          date +%s > .last_reminder
          echo "已发送提醒，时间戳已更新"
