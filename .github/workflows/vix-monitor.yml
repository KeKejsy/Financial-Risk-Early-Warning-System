name: VIX Warning (cloud)

# 由 cron-job.org 外部 POST dispatches API 触发：北京时间 09:00–23:59 内
# 每小时 :07 / :37 调一次。GitHub 端 schedule 在本仓库 / 账户上验证过整体
# 失效（重命名 workflow、canary 测试均无 schedule 触发），故彻底放弃
# `on.schedule`，仅留 `workflow_dispatch` 作为唯一入口。
on:
  workflow_dispatch:

permissions:
  contents: read

# 避免上一次还没跑完，下一次就开跑（dedup 状态会被覆盖）
concurrency:
  group: vix-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ secrets.BARK_SERVER }}
      BARK_SOUND: ${{ secrets.BARK_SOUND }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 跨 run 复用去重状态。key 每次唯一，restore-keys 拉最近一份。
      - name: Restore dedup state
        uses: actions/cache@v5
        with:
          path: data
          key: dedup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dedup-

      - name: Run single check
        run: python main.py --once

      - name: Upload log artifact (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
