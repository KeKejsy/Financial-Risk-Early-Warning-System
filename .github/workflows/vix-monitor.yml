name: VIX Warning (cloud)

# 仅北京时间 09:00–23:59 触发（= UTC 01:00–15:59），与 config.yaml 的静默时段对齐
# 注意：仓库 60 天无活动后 GitHub 会自动停掉 cron，需要时进 Actions 手动重启
# cron 用 :07/:22/:37/:52 错开整点，规避 GitHub free tier 在每小时 :00 的高峰延迟/跳过
on:
  schedule:
    - cron: '7-52/15 1-15 * * *'
  workflow_dispatch:

permissions:
  contents: read

# 避免上一次还没跑完，下一次就开跑（dedup 状态会被覆盖）
concurrency:
  group: vix-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ secrets.BARK_SERVER }}
      BARK_SOUND: ${{ secrets.BARK_SOUND }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 跨 run 复用去重状态。key 每次唯一，restore-keys 拉最近一份。
      - name: Restore dedup state
        uses: actions/cache@v5
        with:
          path: data
          key: dedup-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dedup-

      - name: Run single check
        run: python main.py --once

      - name: Upload log artifact (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
