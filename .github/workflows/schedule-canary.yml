# 临时测试 workflow：验证本仓库 / 账户的 schedule 触发是否整体失效
# 每 5 分钟跑一次，只打印触发源和时间戳。测试结果出来后立即删除。

name: Schedule Canary (temporary)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Print trigger info
        run: |
          echo "Triggered by: $GITHUB_EVENT_NAME"
          echo "UTC time:     $(date -u)"
          echo "BJ  time:     $(TZ=Asia/Shanghai date)"
